<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E7E"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0E0B1A"/>

  <!-- blob body: organic asymmetric shape, not a plain circle -->
  <path d="M256 84
           C 330 80, 400 118, 418 190
           C 434 254, 412 312, 372 356
           C 330 402, 262 424, 196 404
           C 132 386, 88 330, 82 262
           C 76 192, 112 122, 178 96
           C 202 86, 230 82, 256 84 Z"
        fill="url(#blobGrad)"/>
  <path d="M256 84
           C 330 80, 400 118, 418 190
           C 434 254, 412 312, 372 356
           C 330 402, 262 424, 196 404
           C 132 386, 88 330, 82 262
           C 76 192, 112 122, 178 96
           C 202 86, 230 82, 256 84 Z"
        fill="url(#glow)"/>

  <!-- little download-arrow antenna -->
  <line x1="256" y1="84" x2="256" y2="44" stroke="#DFFF3C" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="34" r="14" fill="#DFFF3C"/>

  <!-- face -->
  <circle cx="200" cy="236" r="17" fill="#0E0B1A"/>
  <circle cx="296" cy="236" r="17" fill="#0E0B1A"/>
  <circle cx="207" cy="229" r="5" fill="#F6F2FF"/>
  <circle cx="303" cy="229" r="5" fill="#F6F2FF"/>

  <!-- big happy chomp smile -->
  <path d="M188 284 C 214 320, 298 320, 324 284 C 324 330, 280 356, 256 356 C 232 356, 188 330, 188 284 Z"
        fill="#0E0B1A"/>
  <path d="M206 296 C 222 312, 290 312, 306 296" stroke="#FF2E7E" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- cheek blush -->
  <ellipse cx="164" cy="272" rx="16" ry="10" fill="#FFB8DA" opacity="0.55"/>
  <ellipse cx="348" cy="272" rx="16" ry="10" fill="#FFB8DA" opacity="0.55"/>
</svg>

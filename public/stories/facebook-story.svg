  </defs>
  <rect width="800" height="420" fill="#171226"/>
  <rect width="800" height="420" fill="url(#glow4a)"/>
  <rect width="800" height="420" fill="url(#glow4b)"/>

  <!-- left: dorm window, laptop glow, x mark (facemash shut down) -->

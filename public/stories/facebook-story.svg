    <line x1="-45" y1="20" x2="0" y2="45" stroke="#B8AED6" stroke-width="2.5"/>
    <line x1="45" y1="20" x2="0" y2="45" stroke="#B8AED6" stroke-width="2.5"/>
    <line x1="-45" y1="20" x2="45" y2="20" stroke="#B8AED6" stroke-width="2.5"/>

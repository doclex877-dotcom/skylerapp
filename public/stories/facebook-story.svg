    <line x1="-30" y1="35" x2="30" y2="65" stroke="#FF2E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="35" x2="-30" y2="65" stroke="#FF2E7E" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="150" y="330" text-anchor="middle" fill="#B8AED6" font-family="'IBM Plex Mono', monospace" font-size="15">Facemash, shut down in days</text>

  <path d="M290 210 L510 210" stroke="#DFFF3C" stroke-width="4" stroke-dasharray="10 10" fill="none"/>
  <path d="M498 195 L516 210 L498 225" fill="none" stroke="#DFFF3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: network of connected nodes -->
  <g transform="translate(650,210)">
    <circle cx="0" cy="0" r="44" fill="#DFFF3C" opacity="0.12"/>
    <circle cx="0" cy="-40" r="10" fill="#DFFF3C"/>

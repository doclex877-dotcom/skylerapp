    <line x1="-15" y1="-70" x2="15" y2="-70" stroke="#B8AED6" stroke-width="4"/>
    <line x1="-18" y1="10" x2="18" y2="10" stroke="#B8AED6" stroke-width="3"/>
    <line x1="-18" y1="30" x2="18" y2="30" stroke="#B8AED6" stroke-width="3"/>
    <line x1="-18" y1="50" x2="18" y2="50" stroke="#B8AED6" stroke-width="3"/>
  </g>
  <text x="150" y="330" text-anchor="middle" fill="#B8AED6" font-family="'IBM Plex Mono', monospace" font-size="15">too many features</text>

  <path d="M290 210 L510 210" stroke="#DFFF3C" stroke-width="4" stroke-dasharray="10 10" fill="none"/>
  <path d="M498 195 L516 210 L498 225" fill="none" stroke="#DFFF3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>


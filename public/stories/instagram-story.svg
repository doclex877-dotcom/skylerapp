      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3b" cx="82%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FF2E7E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF2E7E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="#171226"/>
  <rect width="800" height="420" fill="url(#glow3a)"/>
  <rect width="800" height="420" fill="url(#glow3b)"/>

  <!-- left: bottle + checklist (Burbn, overloaded features) -->
  <g transform="translate(150,210)" opacity="0.55">
    <path d="M-15 -70 L-15 -50 L-28 -20 L-28 70 L28 70 L28 -20 L15 -50 L15 -70 Z"
